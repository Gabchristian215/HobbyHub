services:
  - type: web
    runtime: static
    name: hobbyhub
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Set in the Render dashboard (or on first Blueprint sync).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      # Single-page app: let React Router handle every path.
      - type: rewrite
        source: /*
        destination: /index.html
